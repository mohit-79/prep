<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Interview Preparation Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #18181b;
      --card-bg: #222226;
      --card-inner: #26262b;
      --border: #333338;
      --border-light: #3f3f46;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --easy: #22c55e;
      --medium: #f59e0b;
      --hard: #ef4444;
      --green-row: rgba(34, 197, 94, 0.12);
      --green-row-hover: rgba(34, 197, 94, 0.18);
      --green-border: rgba(34, 197, 94, 0.35);
      --code-bg: #141416;
      --primary: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    /* Top Navigation / Progress Header */
    header {
      background: #1c1c20;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 1rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .logo-badge {
      background: #2a2a30;
      border: 1px solid var(--border);
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .title-area h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }

    .progress-stats {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .progress-pill {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .progress-pill strong {
      color: var(--easy);
      font-size: 1rem;
    }

    .progress-bar-bg {
      width: 140px;
      height: 8px;
      background: #2f2f35;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      width: 0%;
      transition: width 0.3s ease;
    }

    .save-status {
      font-size: 0.8rem;
      color: #71717a;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .save-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--easy);
    }

    /* Main Content Container */
    .container {
      max-width: 1100px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Category Group Box (Matches User Screenshot) */
    .category-box {
      background: #1f1f23;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .category-header {
      padding: 1rem 1.25rem 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #f4f4f5;
      border-bottom: 1px solid #2a2a30;
      background: #1b1b1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-count {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .questions-table {
      display: flex;
      flex-direction: column;
    }

    /* Individual Question Row */
    .q-row {
      display: grid;
      grid-template-columns: 36px 32px 1fr auto auto;
      align-items: center;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #28282e;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      gap: 0.75rem;
    }

    .q-row:last-child {
      border-bottom: none;
    }

    .q-row:hover {
      background-color: #26262c;
    }

    /* Completed row green tint */
    .q-row.is-completed {
      background-color: var(--green-row);
      border-bottom-color: rgba(34, 197, 94, 0.2);
    }

    .q-row.is-completed:hover {
      background-color: var(--green-row-hover);
    }

    /* Circular Checkbox (like screenshot) */
    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .round-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.8px solid #52525b;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: all 0.15s ease;
      background: transparent;
    }

    .round-checkbox:hover {
      border-color: #a1a1aa;
    }

    .round-checkbox:checked {
      background-color: var(--easy);
      border-color: var(--easy);
    }

    .round-checkbox:checked::before {
      content: "";
      width: 7px;
      height: 7px;
      background-color: #141416;
      border-radius: 50%;
    }

    /* Star Bookmark Button */
    .star-btn {
      background: transparent;
      border: none;
      color: #52525b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      font-size: 1.15rem;
      line-height: 1;
      transition: color 0.15s ease, transform 0.15s ease;
      user-select: none;
    }

    .star-btn:hover {
      color: #facc15;
      transform: scale(1.15);
    }

    .star-btn.starred {
      color: #eab308;
      filter: drop-shadow(0 0 6px rgba(234, 179, 8, 0.45));
    }

    /* Question Title Link */
    .q-title-wrap {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .q-link {
      color: #e4e4e7;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .q-link:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    .q-row.is-completed .q-link {
      color: #86efac;
    }

    .ext-icon {
      font-size: 0.75rem;
      opacity: 0.5;
    }

    /* Solution Button */
    .solution-btn {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #d4d4d8;
      font-size: 0.82rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      user-select: none;
    }

    .solution-btn:hover {
      background: #2e2e36;
      border-color: #71717a;
      color: #fff;
    }

    .solution-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }

    /* Difficulty Label */
    .difficulty-label {
      font-size: 0.82rem;
      font-weight: 500;
      min-width: 60px;
      text-align: right;
    }

    .diff-Easy { color: var(--easy); }
    .diff-Medium { color: var(--medium); }
    .diff-Hard { color: var(--hard); }

    /* Expandable Solution / Notes Drawer */
    .solution-drawer {
      display: none;
      background: #17171a;
      border-top: 1px solid #28282e;
      padding: 1.25rem 1.5rem 1.5rem 3rem;
      flex-direction: column;
      gap: 1rem;
    }

    .solution-drawer.open {
      display: flex;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* VS Code IDE Styled Code Editor */
    .vscode-window {
      background: #1e1e1e;
      border: 1px solid #333338;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-family: 'Fira Code', Consolas, 'Courier New', monospace;
    }

    .vscode-titlebar {
      background: #252526;
      border-bottom: 1px solid #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.85rem;
      height: 34px;
      user-select: none;
    }

    .vscode-tabs {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .vscode-tab {
      background: #1e1e1e;
      color: #ffffff;
      font-size: 0.78rem;
      padding: 0 1rem;
      height: 100%;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border-top: 2px solid #007acc;
      border-right: 1px solid #252526;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .vscode-tab-sql-icon {
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
    }

    .vscode-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .vscode-copy-btn {
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      color: #cccccc;
      font-size: 0.74rem;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .vscode-copy-btn:hover {
      background: #007acc;
      border-color: #007acc;
      color: #ffffff;
    }

    .vscode-editor {
      display: flex;
      padding: 0.85rem 0;
      background: #1e1e1e;
      overflow-x: auto;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .vscode-line-numbers {
      padding: 0 0.85rem 0 1rem;
      text-align: right;
      color: #858585;
      user-select: none;
      border-right: 1px solid #2d2d2d;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.65;
      white-space: pre;
      display: block;
    }

    .vscode-code-content {
      padding: 0 1.25rem;
      margin: 0;
      color: #d4d4d4;
      white-space: pre;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.65;
      overflow-x: auto;
      flex: 1;
    }

    /* VS Code SQL Syntax Tokens */
    .syn-keyword { color: #569cd6; font-weight: 600; }
    .syn-func { color: #dcdcaa; }
    .syn-string { color: #ce9178; }
    .syn-num { color: #b5cea8; }
    .syn-comment { color: #6a9955; font-style: italic; }
    .syn-op { color: #d4d4d4; }
    .syn-var { color: #9cdcfe; }

    /* Notes Box */
    .notes-box {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .notes-box textarea {
      background: #1c1c20;
      border: 1px solid #333338;
      color: #f4f4f5;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: vertical;
      min-height: 70px;
      outline: none;
    }

    .notes-box textarea:focus {
      border-color: #38bdf8;
    }

    .notes-hint {
      font-size: 0.72rem;
      color: #71717a;
    }
  </style>
</head>
<body>

  <!-- Sticky Header with Progress Stats -->
  <header>
    <div class="header-left">
      <div class="logo-badge">SQL PREP</div>
      <div class="title-area">
        <h1>SQL50 & Curated OA Master Tracker</h1>
      </div>
    </div>
    <div class="progress-stats">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <input 
          type="text" 
          id="filterSearch" 
          placeholder="Filter questions..." 
          oninput="render()"
          style="background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.82rem; outline: none; width: 170px;"
        />
        <button 
          id="starFilterBtn" 
          onclick="toggleStarredOnly()" 
          title="Show only bookmarked/starred questions"
          style="background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; padding: 0.35rem 0.65rem; border-radius: 6px; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; transition: all 0.15s ease;"
        >
          <span style="color: #eab308; font-size: 0.95rem;">★</span> Starred (<span id="starredCount">0</span>)
        </button>
      </div>

      <div class="progress-pill">
        <span>Completed:</span>
        <strong id="completedCount">0</strong> / <span id="totalCount">0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="save-status">
        <div class="save-dot" id="saveDot"></div>
        <span id="saveText">Auto-Saved</span>
      </div>
    </div>
  </header>

  <!-- Main Question Groups -->
  <main class="container" id="categoryContainer">
    <!-- Rendered dynamically -->
  </main>

  <script>
    let questions = [];
    const API_URL = '/api/questions';
    const isServer = window.location.protocol.startsWith('http');

    async function loadData() {
      if (isServer) {
        try {
          const res = await fetch(API_URL);
          if (res.ok) {
            questions = await res.json();
            render();
            return;
          }
        } catch (e) {
          console.warn("Server fetch failed, trying local fallback", e);
        }
      }

      // Fallback
      const cached = localStorage.getItem('sql_master_data');
      if (cached) {
        questions = JSON.parse(cached);
      } else {
        // Initial fetch from relative questions.json if opened via file://
        try {
          const localRes = await fetch('./questions.json');
          if (localRes.ok) {
            questions = await localRes.json();
          }
        } catch(err) {}
      }
      render();
    }

    let saveTimer = null;
    async function saveData() {
      const dot = document.getElementById('saveDot');
      const text = document.getElementById('saveText');
      text.innerText = 'Saving...';
      dot.style.background = '#f59e0b';

      localStorage.setItem('sql_master_data', JSON.stringify(questions));

      if (isServer) {
        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(questions)
          });
        } catch (e) {
          console.error(e);
        }
      }

      setTimeout(() => {
        text.innerText = 'Auto-Saved';
        dot.style.background = '#22c55e';
      }, 300);
    }

    function triggerSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveData, 500);
    }

    let onlyStarred = false;

    function toggleStarredOnly() {
      onlyStarred = !onlyStarred;
      const btn = document.getElementById('starFilterBtn');
      if (onlyStarred) {
        btn.style.background = '#eab308';
        btn.style.color = '#18181b';
        btn.style.borderColor = '#eab308';
      } else {
        btn.style.background = '#27272a';
        btn.style.color = '#a1a1aa';
        btn.style.borderColor = '#3f3f46';
      }
      render();
    }

    function updateProgress() {
      const total = questions.length;
      const completed = questions.filter(q => q.completed).length;
      const starred = questions.filter(q => q.starred).length;
      const pct = total > 0 ? (completed / total) * 100 : 0;

      document.getElementById('totalCount').innerText = total;
      document.getElementById('completedCount').innerText = completed;
      document.getElementById('starredCount').innerText = starred;
      document.getElementById('progressBar').style.width = pct + '%';
    }

    function updateCategoryCounts() {
      const categories = [...new Set(questions.map(q => q.category || 'General'))];
      categories.forEach(cat => {
        const catItems = questions.filter(q => (q.category || 'General') === cat);
        const catComp = catItems.filter(q => q.completed).length;
        const countEl = document.getElementById(`cat-count-${slugify(cat)}`);
        if (countEl) {
          countEl.innerText = `${catComp} / ${catItems.length} completed`;
        }
      });
    }

    function slugify(text) {
      return text.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
    }

    function render() {
      updateProgress();
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';

      const searchVal = (document.getElementById('filterSearch')?.value || '').toLowerCase().trim();

      // Group questions by category preserving order
      const categories = [];
      const catMap = {};

      questions.forEach((q, idx) => {
        const cat = q.category || 'General';
        if (!catMap[cat]) {
          catMap[cat] = [];
          categories.push(cat);
        }
        catMap[cat].push({ data: q, index: idx });
      });

      categories.forEach(cat => {
        const allItems = catMap[cat];
        const catCompleted = allItems.filter(i => i.data.completed).length;

        // Apply filter (search + star)
        const visibleItems = allItems.filter(({ data }) => {
          if (onlyStarred && !data.starred) return false;
          if (searchVal && !data.title.toLowerCase().includes(searchVal) && !(data.notes || '').toLowerCase().includes(searchVal)) return false;
          return true;
        });

        if (visibleItems.length === 0 && (onlyStarred || searchVal)) {
          return; // skip empty categories when filtered
        }

        const box = document.createElement('div');
        box.className = 'category-box';

        box.innerHTML = `
          <div class="category-header">
            <span>${cat}</span>
            <span class="category-count" id="cat-count-${slugify(cat)}">${catCompleted} / ${allItems.length} completed</span>
          </div>
          <div class="questions-table" id="cat-list-${slugify(cat)}"></div>
        `;

        const list = box.querySelector('.questions-table');

        visibleItems.forEach(({ data, index }) => {
          const itemEl = document.createElement('div');
          itemEl.style.display = 'contents';

          const isCompleted = data.completed ? 'is-completed' : '';
          const checkedAttr = data.completed ? 'checked' : '';
          const isStarred = data.starred ? 'starred' : '';
          const starIcon = data.starred ? '★' : '☆';

          itemEl.innerHTML = `
            <div class="q-row ${isCompleted}" id="row-${index}">
              <div class="checkbox-container">
                <input 
                  type="checkbox" 
                  class="round-checkbox" 
                  ${checkedAttr} 
                  onchange="toggleComplete(${index}, this.checked)"
                />
              </div>
              <div>
                <button 
                  class="star-btn ${isStarred}" 
                  id="star-${index}" 
                  onclick="toggleStar(${index})" 
                  title="Bookmark question"
                >
                  ${starIcon}
                </button>
              </div>
              <div class="q-title-wrap">
                <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="q-link">
                  ${escapeHtml(data.title)}
                  <span class="ext-icon">↗</span>
                </a>
              </div>
              <div>
                <button class="solution-btn" id="sol-btn-${index}" onclick="toggleSolution(${index})">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  Solution
                </button>
              </div>
              <div class="difficulty-label diff-${data.difficulty}">
                ${data.difficulty}
              </div>
            </div>

            <!-- Drawer for Solution & Notes -->
            <div class="solution-drawer" id="drawer-${index}">
              <div class="vscode-window">
                <div class="vscode-titlebar">
                  <div class="vscode-tabs">
                    <div class="vscode-tab">
                      <span class="vscode-tab-sql-icon">SQL</span>
                      <span>solution.sql</span>
                    </div>
                  </div>
                  <div class="vscode-actions">
                    <button class="vscode-copy-btn" onclick="copySql(${index})">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                      Copy Query
                    </button>
                  </div>
                </div>
                <div class="vscode-editor">
                  <div class="vscode-line-numbers">${generateLineNumbers(data.solution || '')}</div>
                  <pre class="vscode-code-content"><code>${highlightSql(data.solution || '-- No solution added')}</code></pre>
                </div>
              </div>
              
              <div class="notes-box">
                <span class="drawer-title" style="color: #94a3b8; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Personal Notes & Tricky Clauses (Auto-Saved)</span>
                <textarea 
                  placeholder="Record edge cases, NULL pitfalls, syntax gotchas here..."
                  oninput="updateNotes(${index}, this.value)"
                >${escapeHtml(data.notes || '')}</textarea>
                <span class="notes-hint">Changes automatically persist to questions.json</span>
              </div>
            </div>
          `;
          list.appendChild(itemEl);
        });

        container.appendChild(box);
      });
    }

    function toggleComplete(index, isChecked) {
      questions[index].completed = isChecked;
      const row = document.getElementById(`row-${index}`);
      if (isChecked) {
        row.classList.add('is-completed');
      } else {
        row.classList.remove('is-completed');
      }
      updateProgress();
      updateCategoryCounts();
      triggerSave();
    }

    function toggleStar(index) {
      questions[index].starred = !questions[index].starred;
      const starBtn = document.getElementById(`star-${index}`);
      if (questions[index].starred) {
        starBtn.classList.add('starred');
        starBtn.innerText = '★';
      } else {
        starBtn.classList.remove('starred');
        starBtn.innerText = '☆';
      }
      updateProgress();
      triggerSave();
      if (onlyStarred) {
        render();
      }
    }

    function toggleSolution(index) {
      const drawer = document.getElementById(`drawer-${index}`);
      const btn = document.getElementById(`sol-btn-${index}`);
      const isOpen = drawer.classList.contains('open');

      if (isOpen) {
        drawer.classList.remove('open');
        btn.classList.remove('active');
      } else {
        drawer.classList.add('open');
        btn.classList.add('active');
      }
    }

    function updateNotes(index, val) {
      questions[index].notes = val;
      triggerSave();
    }

    function copySql(index) {
      const sol = questions[index].solution || '';
      navigator.clipboard.writeText(sol);
      alert('SQL solution copied to clipboard!');
    }

    function generateLineNumbers(code) {
      if (!code) return '1';
      const lines = code.split('\n').length;
      let numStr = '';
      for (let i = 1; i <= lines; i++) {
        numStr += i + '\n';
      }
      return numStr;
    }

    function highlightSql(sql) {
      if (!sql) return '';
      // Escape HTML first
      let safe = escapeHtml(sql);

      // Split into lines to protect comment highlighting cleanly
      const lines = safe.split('\n');
      const processedLines = lines.map(line => {
        // If line is or contains a SQL comment (-- ...)
        const commentIdx = line.indexOf('--');
        let codePart = line;
        let commentPart = '';

        if (commentIdx !== -1) {
          codePart = line.slice(0, commentIdx);
          commentPart = `<span class="syn-comment">${line.slice(commentIdx)}</span>`;
        }

        // Keywords
        const keywords = [
          'SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'NOT', 'IN', 'IS', 'NULL', 'LIKE',
          'JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'CROSS JOIN', 'ON', 'AS',
          'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET', 'UNION', 'UNION ALL',
          'WITH', 'CASE', 'WHEN', 'THEN', 'ELSE', 'END', 'OVER', 'PARTITION BY',
          'ROWS BETWEEN', 'PRECEDING', 'FOLLOWING', 'CURRENT ROW', 'DISTINCT',
          'INTERVAL', 'DAY', 'MONTH', 'YEAR', 'DELETE', 'BETWEEN', 'ASC', 'DESC'
        ];

        // Functions
        const funcs = [
          'COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'ROUND', 'IFNULL', 'COALESCE',
          'DATE_FORMAT', 'DATE_ADD', 'DATE_SUB', 'DATEDIFF', 'SUBDATE', 'EXTRACT',
          'ROW_NUMBER', 'RANK', 'DENSE_RANK', 'LEAD', 'LAG', 'IF', 'LENGTH',
          'CHAR_LENGTH', 'UPPER', 'LOWER', 'SUBSTRING', 'CONCAT', 'GROUP_CONCAT', 'REGEXP'
        ];

        // Replace strings ('text')
        codePart = codePart.replace(/'([^']*)'/g, '<span class="syn-string">\'$1\'</span>');

        // Replace numbers
        codePart = codePart.replace(/\b(\d+)\b/g, '<span class="syn-num">$1</span>');

        // Replace SQL Functions
        funcs.forEach(fn => {
          const regex = new RegExp(`\\b(${fn})\\b(?=\\s*\\()`, 'gi');
          codePart = codePart.replace(regex, '<span class="syn-func">$1</span>');
        });

        // Replace SQL Keywords
        keywords.forEach(kw => {
          const regex = new RegExp(`\\b(${kw})\\b`, 'gi');
          codePart = codePart.replace(regex, '<span class="syn-keyword">$1</span>');
        });

        return codePart + commentPart;
      });

      return processedLines.join('\n');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    loadData();
  </script>
</body>
</html>
